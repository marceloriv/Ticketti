services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketti-frontend
    restart: unless-stopped
    networks:
      - ticketti-network
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ticketti-network:
    external: true
    name: ticketti-network
